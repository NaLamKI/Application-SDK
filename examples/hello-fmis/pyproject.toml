[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello_fmis"
version = "0.1.0"
description = "Hello FMIS – an extension for the FMIS app"
requires-python = ">=3.12"
# Add what your backend needs next to the SDK.
dependencies = ["appext>=0.1,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

# The project only declares dependencies; the code runs from the source tree
# (and from /app in the image), so there is nothing to package.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
