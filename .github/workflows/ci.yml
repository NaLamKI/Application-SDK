name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The SPA template's tests build its frontend with npm.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[test]"
      - run: pytest
