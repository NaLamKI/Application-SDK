[extension]
id = "demo-app"
name = "Demo app"
version = "1.0.0"
entry = "/app/index.html?tab=1"
icon = "frontend/dist/icon.svg"
description = "Evaluations across all projects"
min_app_version = "1.0.0"
hosts = ["cdn.example.com", "fonts.example.com"]
audience_roles = ["advisor", "Farm-Manager"]
client_auth = "private_key_jwt"
dev_port = 8000

[extension.name_localized]
de = "Projektauswertung"
"pt-BR" = "Avaliacao de projetos"

[extension.description_localized]
de = "Auswertungen ueber alle Projekte"

[consent]
scopes = ["ext-data-read"]

[[services]]
name = "fmis"
audience = "fmis-api"
scopes = ["ext-stock-read"]
mode = "user"

[[services]]
name = "export"
audience = "export-api"
scopes = ["svc-export-write", "svc-export-read"]
mode = "service"
