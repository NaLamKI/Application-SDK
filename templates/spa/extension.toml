# The manifest of this extension: what the App Store registers, what the SDK reads
# at start-up. No secret ever belongs here. Every key is explained in
# docs/manifest.md of the SDK; `appext manifest check` tells you what is wrong.

[extension]
id = "{{id}}"
name = "{{name}}"
description = "An extension for {{platform_name}}"
version = "0.1.0"
entry = "/"
icon = "icon.svg"
# Where the host app shows the extension: "in_app" (the default) – inside the app – or "external":
# the app only hands over to the system browser, a jump-off point to your own site.
# display = "external"
# Local development port (`appext dev`). 8000 is a common port of the platform's API on a developer machine.
dev_port = 8100

# Optional: the name and the description in other languages, one table each, keyed by language code.
# [extension.name_localized]
# <language code> = "<translated name>"
#
# [extension.description_localized]
# <language code> = "<translated description>"

[consent]
# Scopes the person confirms on first open. Scopes of a service you call on their
# behalf belong under [[services]] instead: each scope may be named only once.
scopes = []

[[services]]
# The name in code: ext.service("{{service}}").
name = "{{service}}"
# The OAuth client of the target service.
audience = "{{audience}}"
# What the extension may do there; ask for no more than it needs.
scopes = ["{{scope}}"]
# On behalf of the signed-in person.
mode = "user"
