[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appext"
version = "0.1.0"
description = "SDK for building extensions of platforms that follow the reference architecture: sign-in, server-side session and calls to other services on behalf of the user"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43",
    # `appext serve` (package appext.cli) runs the app with uvicorn.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
redis = ["redis>=5"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.26",
    "redis>=5",
    # the htmx template renders pages with Jinja2 (its tests run inside the SDK test suite)
    "jinja2>=3.1",
]

[project.scripts]
appext = "appext.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appext"]

# Templates and the base-image recipe ship inside the wheel (see hatch_build.py);
# they live next to the package in the repository, so nothing is copied by hand.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "templates", "docker", "conformance", "examples", "docs", "hatch_build.py", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fakeredis.*"]
